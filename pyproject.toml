[project]
name = "monosplit"
version = "0.1.0"
description = "Controlled experiment comparing microservice decompositions of Java monoliths produced by a general-purpose LLM, agglomerative hierarchical clustering and a random partition."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ericles Dos Santos Cunha" }]
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "pymongo>=4.10",
]

[project.optional-dependencies]
# One extra per LLM provider. `uv sync --all-extras` installs every SDK.
openai = ["openai>=1.60"]
anthropic = ["anthropic>=0.50"]
gemini = ["google-genai>=1.0"]
# Local models in Ollama: its REST API, called with httpx.
ollama = ["httpx>=0.27"]
# Web interface (monosplit web serve / export).
web = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
monosplit = "monosplit.cli:main"

[dependency-groups]
dev = [
    "mongomock>=4.3",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monosplit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
